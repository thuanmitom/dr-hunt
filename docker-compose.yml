name: outsight-huntcompiler

# Network layout
#   backend : internal-only (no Internet egress). postgres + redis live here exclusively.
#   egress  : Internet access for collectors/API. Only app containers join it.
# The API binds to 127.0.0.1 — publish it through a TLS reverse proxy, never directly.

x-app-env: &app-env
  HC_DATABASE_URL: postgresql+asyncpg://huntcompiler:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/huntcompiler
  HC_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/2
  HC_CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  HC_CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1

x-app: &app
  build: .
  image: outsight-huntcompiler:${HC_IMAGE_TAG:-dev}
  env_file: .env
  environment: *app-env
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [backend, egress]
  volumes:
    - ./config:/app/config:ro

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: huntcompiler
      POSTGRES_USER: huntcompiler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huntcompiler -d huntcompiler"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # noeviction: Redis is the Celery broker — evicting keys would silently drop queued tasks.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}",
              "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--no-server-header"]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "--loglevel=INFO",
              "-Q", "default,collectors,compiler,dispatch", "--concurrency=4"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *app
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "beat", "--loglevel=INFO",
              "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  certstream:
    <<: *app
    command: ["python", "-m", "app.collectors.certstream_watcher"]
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # Phase T: Telegram command bot (long polling, outbound only). Not started by a plain `docker compose up`;
  # start it explicitly with `docker compose up -d telegram-bot`. The digest itself runs in worker + beat.
  telegram-bot:
    <<: *app
    command: ["python", "-m", "app.integrations.telegram.bot"]
    profiles: ["telegram"]
    restart: on-failure  # exits 0 when HC_TGBOT_ENABLED=false instead of restarting in a loop
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  pg_data:
  redis_data:

networks:
  backend:
    internal: true
  egress:
