line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
# ASYNC109: `timeout` is forwarded to the JARM scanner on purpose.
ignore = ["ASYNC109"]

[lint.per-file-ignores]
"tests/*" = ["E501"]
# Data-heavy builders keep one entry per line inside `# fmt: skip` blocks.
"app/collectors/reference_data.py" = ["E501"]
"app/collectors/telegram_cti.py" = ["E501"]
"app/compiler/templates.py" = ["E501"]
